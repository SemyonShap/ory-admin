apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "common.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  {{- if .Values.pod.securityContext }}
  securityContext:
    {{- toYaml .Values.pod.securityContext | nindent 4 }}
  {{- end }}
  containers:
    - name: curl
      image: curlimages/curl:7.88.1
      command:
        - sh
        - -c
        - |
          echo "=== ory-admin connection test ==="
          echo "Testing HTTP endpoint..."
          curl -sS --fail -o /dev/null -w "HTTP %{http_code}\n" \
            http://{{ include "common.fullname" . }}:{{ .Values.service.port }}/api/health
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: 50m
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 32Mi
  restartPolicy: Never
